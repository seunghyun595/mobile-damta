<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모바일 담타">
<meta property="og:title" content="모바일 담타">
<meta property="og:description" content="회사에서 몰래 피우는 한 대. 연초·전자담배, 라이터, 장소와 날씨를 고르는 풍자용 흡연 시뮬레이터.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>모바일 담타</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="회사에서 몰래 피우는 한 대. 연초·전자담배, 라이터, 장소와 날씨를 고르는 풍자용 흡연 시뮬레이터.">
<meta name="theme-color" content="#050607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Noto+Sans+KR:wght@400;500;800&display=swap">
<style>
/* Layout: one full-bleed cinematic stage (bg scene → props → GPU smoke), a hairline HUD on top, a glass dock at the bottom. */
:root {
  color-scheme: dark;
  --ink: #050607;
  --glass: rgba(18, 19, 22, 0.44);
  --glass-strong: rgba(14, 15, 18, 0.72);
  --line: rgba(255, 255, 255, 0.09);
  --text: #ece6dc;
  --muted: rgba(236, 230, 220, 0.52);
  --ember: #ff7a2e;
  --ember-hi: #ffb877;
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-title: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --focus: 0;
  --warm: 0;
  --flash: 0;
}
html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; overscroll-behavior: none; }
body {
  color: var(--text); font-family: var(--font-ui); font-size: 14px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#app canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bg { opacity: 0; transition: opacity 2.2s cubic-bezier(.2, .7, .2, 1); }
#fg { opacity: 0; transition: opacity 1.6s ease .5s; }
body.live #bg, body.live #fg { opacity: 1; }
#smoke { pointer-events: none; }
.fx { position: absolute; inset: 0; pointer-events: none; }
#vignette {
  background: radial-gradient(120% 95% at 50% 58%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, .62) 100%);
  opacity: calc(.7 + var(--focus) * .3);
}
#vignette::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(80% 60% at 50% 60%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .5) 100%);
  opacity: var(--focus);
}
#warm {
  background: radial-gradient(70% 55% at 46% 72%, rgba(255, 120, 40, .55), rgba(255, 90, 20, 0) 70%);
  mix-blend-mode: soft-light; opacity: var(--warm);
}
#grade {
  background: linear-gradient(180deg, rgba(24, 66, 92, .6) 0%, rgba(30, 64, 84, .22) 46%, rgba(255, 146, 72, .2) 100%);
  mix-blend-mode: soft-light; opacity: .62;
}
#matte { background: #16181c; mix-blend-mode: lighten; opacity: .92; }
#flash { background: #dfe6ff; opacity: calc(var(--flash) * .22); mix-blend-mode: screen; }
#grain {
  inset: -60px; background-size: 140px 140px; opacity: .07; mix-blend-mode: overlay;
  animation: grain .9s steps(6) infinite;
}
@keyframes grain {
  0% { transform: translate(0, 0); } 17% { transform: translate(-37px, 21px); } 33% { transform: translate(24px, -48px); }
  50% { transform: translate(-51px, -12px); } 67% { transform: translate(43px, 33px); } 83% { transform: translate(-14px, 52px); } 100% { transform: translate(0, 0); }
}
#curtain { background: #000; opacity: 0; transition: opacity .36s ease; }
#curtain.on { opacity: 1; }
#stage { position: absolute; inset: 0; touch-action: none; cursor: default; }

/* ── UI layer */
#ui {
  position: absolute; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; transition: opacity 1.2s ease 1.2s;
}
body.live #ui { opacity: calc(1 - var(--focus) * .82); transition: opacity .5s ease; }
#ui button { pointer-events: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
button:focus-visible { outline: 1.5px solid var(--ember-hi); outline-offset: 3px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

#hud {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start;
}
.tally { display: flex; flex-direction: column; gap: 4px; }
.tally .row { display: flex; gap: 14px; align-items: center; }
.tally .t { display: flex; align-items: center; gap: 7px; color: var(--text); text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
.tally .t svg { width: 18px; height: 18px; opacity: .72; filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .6)); }
.tally b { font-family: var(--font-num); font-weight: 300; font-size: 21px; letter-spacing: 0; font-variant-numeric: tabular-nums; line-height: 1; }
.tally .t.bump b { animation: bump .9s cubic-bezier(.2, 1.4, .3, 1); }
@keyframes bump { 0% { transform: scale(1); color: var(--ember-hi); } 30% { transform: scale(1.35); color: var(--ember-hi); } 100% { transform: scale(1); } }
#timer { font-family: var(--font-num); font-style: normal; font-size: 11px; letter-spacing: .12em; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1em; padding-left: 2px; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); display: flex; align-items: center; gap: 7px; }
#timer:empty { visibility: hidden; }
#timer::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 8px rgba(255, 59, 48, .8); animation: rec 1.6s steps(2, jump-none) infinite; }
@keyframes rec { 0% { opacity: 1; } 100% { opacity: .15; } }
.tools { display: flex; gap: 8px; }
.round {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
  color: var(--text); transition: transform .2s ease, background .2s ease, color .2s ease;
}
.round svg { width: 19px; height: 19px; }
.round:active { transform: scale(.92); }
#bSound .slash { display: none; }
#bSound.off { color: var(--muted); }
#bSound.off .slash { display: block; }
#bSound.off .wave { display: none; }

#dock {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 5px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
  max-width: calc(100vw - 32px);
}
#dock > button, .seg button {
  width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: rgba(236, 230, 220, .78);
  transition: color .2s ease, background .25s ease, transform .15s ease;
}
#dock > button:active, .seg button:active { transform: scale(.9); }
#dock > button.active { background: rgba(255, 255, 255, .1); color: var(--text); }
#dock > button.on { color: var(--ember-hi); }
#dock > button.on svg { filter: drop-shadow(0 0 6px rgba(255, 140, 60, .7)); }
#dock .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.seg { position: relative; display: flex; border-radius: 999px; background: rgba(0, 0, 0, .28); padding: 0; }
.seg .pill { position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-radius: 999px; background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); transition: transform .45s cubic-bezier(.3, 1.3, .4, 1); }
#dock[data-mode="vape"] .seg .pill { transform: translateX(44px); }
.seg button { position: relative; z-index: 1; }
#dock[data-mode="cig"] .seg [data-mode="cig"], #dock[data-mode="vape"] .seg [data-mode="vape"] { color: var(--text); }
#dock[data-mode="vape"] #bLighter { display: none; }
#bProduct .i-vape { display: none; }
#dock[data-mode="vape"] #bProduct .i-cig { display: none; }
#dock[data-mode="vape"] #bProduct .i-vape { display: block; }

#bAction {
  position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 82px);
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); border: 1px solid rgba(255, 150, 80, .28); color: var(--ember-hi);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 0 0 0 rgba(255, 120, 40, 0), 0 8px 26px rgba(0, 0, 0, .35);
  opacity: 0; transform: translateY(12px) scale(.9); pointer-events: none !important;
  transition: opacity .35s ease, transform .45s cubic-bezier(.3, 1.4, .4, 1);
}
#bAction.show { opacity: 1; transform: none; pointer-events: auto !important; }
#bAction svg { width: 24px; height: 24px; }
#bAction .i-eject { display: none; }
#bAction[data-kind="eject"] .i-eject { display: block; }
#bAction[data-kind="eject"] .i-stub { display: none; }

#sheet {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  width: min(560px, calc(100vw - 24px));
  transform: translate(-50%, 18px) scale(.98); opacity: 0; pointer-events: none;
  border-radius: 24px; background: var(--glass-strong); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
  box-shadow: 0 18px 60px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
  transition: opacity .28s ease, transform .4s cubic-bezier(.25, 1.2, .4, 1);
  padding: 12px 0 10px;
}
#sheet.open { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#sheet * { pointer-events: auto; }
.rail { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 2px; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.rail::-webkit-scrollbar { display: none; }
#rail2 { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.card {
  flex: 0 0 auto; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 6px 6px 8px; border-radius: 16px; border: 1px solid transparent; transition: background .2s ease, border-color .2s ease, transform .15s ease;
}
.card canvas { display: block; border-radius: 11px; }
.card.scene canvas { box-shadow: 0 6px 18px rgba(0, 0, 0, .4); }
.card span { font-size: 10.5px; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.card:active { transform: scale(.95); }
.card.on { background: rgba(255, 255, 255, .06); border-color: rgba(255, 160, 90, .4); }
.card.on span { color: var(--ember-hi); }
.chip {
  flex: 0 0 auto; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px;
  border-radius: 14px; color: rgba(236, 230, 220, .7); border: 1px solid transparent; transition: background .2s ease, color .2s ease, border-color .2s ease;
}
.chip svg { width: 24px; height: 24px; }
.chip span { font-size: 10.5px; letter-spacing: .04em; }
.chip.on { color: var(--ember-hi); background: rgba(255, 255, 255, .06); border-color: rgba(255, 160, 90, .35); }
.dot { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.dot::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); opacity: .9; transition: transform .2s ease; }
.dot.on { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .7); }
.dot.on::before { transform: scale(1.1); }

#ring { position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; pointer-events: none; opacity: 0; transition: opacity .25s ease; z-index: 3; }
#ring.on { opacity: 1; }
#ring svg { width: 40px; height: 40px; transform: rotate(-90deg); }
#ring .track { stroke: rgba(255, 255, 255, .16); stroke-width: 1.4; }
#ring .arc { stroke: var(--ember-hi); stroke-width: 1.8; transition: stroke .3s ease; filter: drop-shadow(0 0 4px rgba(255, 130, 50, .8)); }
#ring.full .arc { stroke: #ff5a4a; }

/* ── intro */
#intro {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px;
  z-index: 5; cursor: pointer; transition: opacity 1.2s ease;
}
#intro h1 {
  margin: 0; font-family: var(--font-title); font-weight: 800; font-size: clamp(34px, 10vw, 64px);
  letter-spacing: -.035em; color: #f1ece4; white-space: nowrap; line-height: 1;
  text-shadow: 0 0 40px rgba(255, 210, 170, .1);
  animation: titleIn 2.2s cubic-bezier(.2, .7, .2, 1) both;
  transition: opacity .7s ease, filter .9s ease, transform 1.2s ease;
}
@keyframes titleIn { from { opacity: 0; filter: blur(12px); transform: scale(1.06); } to { opacity: 1; filter: blur(0); transform: none; } }
#intro .vf { position: absolute; inset: calc(env(safe-area-inset-top, 0px) + 22px) max(22px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(22px, env(safe-area-inset-left, 0px)); pointer-events: none; animation: fadeIn 1.6s ease .6s both; }
#intro .vf i { position: absolute; width: 18px; height: 18px; border: 0 solid rgba(241, 236, 228, .38); }
#intro .vf i:nth-child(1) { left: 0; top: 0; border-left-width: 1px; border-top-width: 1px; }
#intro .vf i:nth-child(2) { right: 0; top: 0; border-right-width: 1px; border-top-width: 1px; }
#intro .vf i:nth-child(3) { left: 0; bottom: 0; border-left-width: 1px; border-bottom-width: 1px; }
#intro .vf i:nth-child(4) { right: 0; bottom: 0; border-right-width: 1px; border-bottom-width: 1px; }
#intro .vf b { position: absolute; left: 30px; top: 1px; width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 10px rgba(255, 59, 48, .9); animation: rec 1.6s steps(2, jump-none) infinite; }
#start { position: relative; width: 132px; height: 34px; display: block; animation: fadeIn 1.4s ease 1.6s both; }
#start::before {
  content: ""; position: absolute; left: 0; right: 12px; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
  background: linear-gradient(90deg, #c98a4a 0 26%, rgba(255, 255, 255, .85) 26% 100%);
  box-shadow: 0 1px 8px rgba(0, 0, 0, .6);
}
#start::after {
  content: ""; position: absolute; right: 4px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
  background: radial-gradient(circle, #fff2d4 0, #ffb26b 35%, #ff6a1f 70%, rgba(255, 90, 20, 0) 100%);
  box-shadow: 0 0 14px 4px rgba(255, 110, 40, .55);
  animation: ember 2.4s ease-in-out infinite;
}
@keyframes ember { 0%, 100% { box-shadow: 0 0 10px 2px rgba(255, 110, 40, .4); transform: scale(.9); } 50% { box-shadow: 0 0 22px 8px rgba(255, 120, 40, .75); transform: scale(1.15); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#intro.gone { opacity: 0; pointer-events: none; }
#intro.gone h1 { opacity: 0; filter: blur(8px); transform: scale(1.04); }
#intro.gone #start { opacity: 0; transition: opacity .4s ease; }

@media (prefers-reduced-motion: reduce) {
  #grain { animation: none; }
  #intro h1 { animation: none; }
}
@media (min-width: 900px) {
  #dock > button, .seg button { width: 48px; height: 48px; }
  .seg .pill { width: 48px; height: 48px; }
  #dock[data-mode="vape"] .seg .pill { transform: translateX(48px); }
  #stage { cursor: crosshair; }
  #sheet { bottom: 84px; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="fg"></canvas>
  <canvas id="smoke"></canvas>
  <div class="fx" id="warm"></div>
  <div class="fx" id="grade"></div>
  <div class="fx" id="vignette"></div>
  <div class="fx" id="matte"></div>
  <div class="fx" id="flash"></div>
  <div class="fx" id="grain"></div>
  <div id="stage" aria-label="길게 눌러 한 모금"></div>
  <div class="fx" id="curtain"></div>
  <div id="ring"><svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="15"/><circle class="arc" cx="20" cy="20" r="15"/></svg></div>

  <div id="ui">
    <header id="hud">
      <div class="tally">
        <div class="row">
          <span class="t" id="tallyCig" aria-label="오늘 개비 수"><svg viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="4.2" rx="1"/><path d="M7.5 10v4.2"/></svg><b id="nCig">0</b></span>
          <span class="t" id="tallyPuff" aria-label="오늘 모금 수" hidden><svg viewBox="0 0 24 24"><rect x="8.5" y="7.5" width="7" height="13.5" rx="2.2"/><path d="M10.6 7.5V5a1 1 0 0 1 1-1h.8a1 1 0 0 1 1 1v2.5"/></svg><b id="nPuff">0</b></span>
        </div>
        <i id="timer"></i>
      </div>
      <div class="tools">
        <button class="round" id="bFull" type="button" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="round" id="bSound" type="button" aria-label="소리"><svg viewBox="0 0 24 24"><path d="M4 10v4h3.5L12 18V6L7.5 10z"/><path class="wave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      </div>
    </header>

    <button id="bAction" type="button" aria-label="비벼 끄기" data-kind="stub">
      <svg class="i-stub" viewBox="0 0 24 24"><path d="M3.5 13h17l-1.6 4.4a2 2 0 0 1-1.9 1.3H7a2 2 0 0 1-1.9-1.3z"/><path d="M7.5 13l7.5-5.2"/><path d="M16.4 6.6c.8-.6.3-1.7 1-2.4"/></svg>
      <svg class="i-eject" viewBox="0 0 24 24"><path d="M12 5l6 7H6z"/><path d="M6 16.5h12"/></svg>
    </button>

    <section id="sheet" aria-label="선택">
      <div class="rail" id="rail"></div>
      <div class="rail" id="rail2" hidden></div>
    </section>

    <nav id="dock" data-mode="cig">
      <div class="seg" id="mode">
        <i class="pill"></i>
        <button type="button" data-mode="cig" aria-label="연초"><svg viewBox="0 0 24 24"><rect x="2.5" y="13" width="16.5" height="4" rx="1"/><path d="M7.5 13v4"/><path d="M21.2 11.6c0-1.6-1.5-1.9-1.5-3.4s1.5-1.9 1.5-3.4"/></svg></button>
        <button type="button" data-mode="vape" aria-label="전자담배"><svg viewBox="0 0 24 24"><rect x="8.5" y="8" width="7" height="13" rx="2.2"/><path d="M10.6 8V5.4a1 1 0 0 1 1-1h.8a1 1 0 0 1 1 1V8"/><path d="M10.6 17.5h2.8"/></svg></button>
      </div>
      <span class="sep"></span>
      <button type="button" id="bProduct" data-sheet="product" aria-label="담배 종류">
        <svg class="i-cig" viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="15.5" rx="1.6"/><path d="M6 9.5h12"/><path d="M9 5V3.5M12 5V3M15 5V3.5"/></svg>
        <svg class="i-vape" viewBox="0 0 24 24"><path d="M12 3.5c2.6 3.4 4.5 5.8 4.5 8.6a4.5 4.5 0 0 1-9 0c0-2.8 1.9-5.2 4.5-8.6z"/><path d="M10 13.5a2 2 0 0 0 2 2"/></svg>
      </button>
      <button type="button" id="bLighter" data-sheet="lighter" aria-label="라이터"><svg viewBox="0 0 24 24"><path d="M12 3c.6 3 4.2 4.6 4.2 8.6a4.2 4.2 0 0 1-8.4 0c0-2.1 1-3.2 2.1-4.2.2 1.5 1 2.4 2.1 2.6-.6-2.4-.6-4.6 0-7z"/><path d="M9 21h6"/></svg></button>

  // ── ambience beds
  function makeBed(id) {
    const loops = [];
    const add = (buf, filters, gain, pan = 0, send = 0.12, rate = 1) => { const l = loop(buf, filters, pan, send, rate); l.base = gain; loops.push(l); return l; };
    const b = { id, loops, level: 1, tick: () => {}, walking: false };
    switch (id) {
      case 'roof': {
        const w = add(brown, [['lowpass', 520], ['highpass', 35]], 0.34);
        add(pink, [['bandpass', 190, 0.5]], 0.07, 0, 0.2);
        add(pink, [['bandpass', 2600, 0.4]], 0.006, 0.3, 0.3);
        b.tick = (t) => { w.set(w.base * b.level * (0.55 + 0.45 * (0.5 + 0.5 * fbm1(t * 0.21))), 0.4); if (Math.random() < 0.02) carPass(0.05); if (Math.random() < 0.004) horn(); };
        break;
      }
      case 'booth': {
        add(brown, [['bandpass', 240, 0.9]], 0.16, 0.3, 0.05);
        add(pink, [['bandpass', 900, 0.6]], 0.028, 0.3, 0.05);
        const hum = ctx.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 59.7;
        const hf = ctx.createBiquadFilter(); hf.type = 'lowpass'; hf.frequency.value = 180;
        const hg = ctx.createGain(); hg.gain.value = 0;
        hum.connect(hf); hf.connect(hg); route(hg, 0.3, 0.02); hum.start();
        const buzzO = ctx.createOscillator(); buzzO.type = 'square'; buzzO.frequency.value = 120;
        const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 240; bf.Q.value = 8;
        const bg = ctx.createGain(); bg.gain.value = 0;
        buzzO.connect(bf); bf.connect(bg); route(bg, -0.2, 0.02); buzzO.start();
        loops.push({ base: 0.012, cur: 0, g: hg, set(v, tc = 0.3) { hg.gain.setTargetAtTime(v, now(), tc); }, stop(f = 0.6) { hg.gain.setTargetAtTime(0, now(), f / 3); hum.stop(now() + f + 0.1); } });
        loops.push({ base: 0.004, cur: 0, g: bg, set(v, tc = 0.3) { bg.gain.setTargetAtTime(v, now(), tc); }, stop(f = 0.6) { bg.gain.setTargetAtTime(0, now(), f / 3); buzzO.stop(now() + f + 0.1); } });
        b.tick = () => { if (Math.random() < 0.006) door(); };
        break;
      }
      case 'street': {
        add(pink, [['lowpass', 620]], 0.11, 0, 0.1);
        add(pink, [['bandpass', 1800, 0.5]], 0.008, -0.2, 0.2);
        b.walking = true;
        b.tick = (t) => { if (Math.random() < 0.06) carPass(rand(0.08, 0.18)); if (Math.random() < 0.01) scooter(); };
        break;
      }
      case 'store': {
        add(brown, [['lowpass', 260]], 0.08, -0.2, 0.05);
        const f = ctx.createOscillator(); f.frequency.value = 98; const fg = ctx.createGain(); fg.gain.value = 0; f.connect(fg); route(fg, -0.3, 0.02); f.start();
        loops.push({ base: 0.01, cur: 0, set(v, tc = 0.3) { fg.gain.setTargetAtTime(v, now(), tc); }, stop(fd = 0.6) { fg.gain.setTargetAtTime(0, now(), fd / 3); f.stop(now() + fd + 0.1); } });
        add(pink, [['lowpass', 500]], 0.05, 0.2, 0.1);
        b.tick = () => { if (Math.random() < 0.012) chime(); if (Math.random() < 0.014) scooter(); if (Math.random() < 0.02) carPass(0.07); };
        break;
      }
      case 'stairs': {
        add(brown, [['lowpass', 140]], 0.07, 0, 0.3);
        add(pink, [['bandpass', 420, 0.6]], 0.006, 0, 0.6);
        b.tick = () => { if (Math.random() < 0.006) door(true); };
        break;
      }
      case 'river': {
        const water = add(brown, [['bandpass', 420, 0.6]], 0.2, -0.1, 0.1);
        add(brown, [['lowpass', 380]], 0.12, 0, 0.1);
        add(pink, [['lowpass', 300]], 0.05, 0.3, 0.2);
        b.tick = (t) => { water.set(water.base * b.level * (0.5 + 0.5 * Math.abs(Math.sin(t * 0.9) * fbm1(t * 0.6))), 0.25); if (Math.random() < 0.01) train(); };

  }
  function setBedLevel(b, lv) { if (!b) return; b.level = lv; for (const l of b.loops) l.set(l.base * lv, 0.8); }

  // ── event sounds
  function carPass(g = 0.14) {
    if (!ready) return;
    const t = now(), dur = rand(2.4, 4.4), dir = Math.random() < 0.5 ? -1 : 1;
    const src = ctx.createBufferSource(); src.buffer = pink;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass';
    const gn = ctx.createGain(); let p = null;
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(g, t + dur * 0.5); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.frequency.setValueAtTime(350, t); f.frequency.linearRampToValueAtTime(1000, t + dur * 0.5); f.frequency.linearRampToValueAtTime(320, t + dur);
    src.connect(f); f.connect(gn);

  }
  function scooter() {
    if (!ready) return;
    const t = now(), dur = rand(3, 4.5), dir = Math.random() < 0.5 ? -1 : 1;
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(rand(95, 120), t); o.frequency.linearRampToValueAtTime(rand(70, 85), t + dur);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 11; const lg = ctx.createGain(); lg.gain.value = 6; lfo.connect(lg); lg.connect(o.frequency);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + dur * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g);

    if (!ready) return;

    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
    const am = ctx.createGain(); const lfo = ctx.createOscillator(); lfo.frequency.value = 6.5; const lg = ctx.createGain(); lg.gain.value = 0.35; lfo.connect(lg); lg.connect(am.gain); am.gain.value = 0.65;

  // ── public api
  const api = {
    get ready() { return ready; },
    get enabled() { return enabled; },
    unlock() { init(); if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); },

    setScene(id, opts = {}) {

    setCrackle(v) { if (!ready) return; L.crackle.set(v * 0.5, 0.04); L.crackle2.set(v * 0.22, 0.05); L.sizzle.set(v * 0.022, 0.06); },

      const X = D.exit;
      ctx.fillStyle = 'rgba(30,210,120,0.95)'; ctx.fillRect(o.nx + X.x - X.w / 2, o.ny + X.y - X.h / 2, X.w, X.h);

      const px = o.nx + X.x - X.w * 0.18, py = o.ny + X.y;
      ctx.beginPath(); ctx.arc(px + X.h * 0.18, py - X.h * 0.22, X.h * 0.1, 0, TAU); ctx.fill();
      ctx.fillRect(px, py - X.h * 0.1, X.h * 0.18, X.h * 0.3);
      ctx.fillRect(px + X.w * 0.25, py - X.h * 0.3, X.w * 0.18, X.h * 0.6);

    },
    amb(e, L) { const k = L.data.lightOn ?? 1; return mixc([0.22, 0.44, 0.32], [0.92, 0.92, 0.86], k); },
    lightLevel(L) { return L.data.lightOn ?? 1; },
  };

  // ══════════════ HAN RIVER ══════════════
  const river = {
    id: 'river', name: '한강', indoor: false, walking: false,
    smoke: { wind: 0.85, buoy: 1, diss: 1.05 },
    build(L, e) {
      const { fw, fh } = L, m = Math.min(fw, fh), r = mulberry(606);
      const c = L.far.getContext('2d');
      const hz = fh * 0.5;
      paintSky(c, fw, hz + 4, e);
      if (e.stars) paintStars(c, fw, hz, r);
      paintCelestial(c, fw, hz, e, m);
      paintClouds(c, fw, hz, e, r);
      const lights = [];
      const tmp = [];
      paintSkyline(c, fw, hz + fh * 0.01, e, r, { minH: fh * 0.02, maxH: fh * 0.07, minW: fw * 0.02, maxW: fw * 0.05, col: mixc(e.bld, e.haze, 0.5), gap: 1, winA: e.lamps * 0.6, winW: 3, winH: 3, lit: 0.45 });
      paintSkyline(c, fw, hz + fh * 0.04, e, r, { minH: fh * 0.04, maxH: fh * 0.17, minW: fw * 0.04, maxW: fw * 0.09, col: mixc(e.bld, e.haze, 0.2), gap: 2, winA: e.lamps * 0.8, winW: 4, winH: 4, lit: 0.5, lights: tmp, pow: 2.4 });
      L.data.blink = tmp;
      // bank lights for reflections
      for (let i = 0; i < 40; i++) lights.push({ x: r() * fw, y: hz + fh * 0.04, c: pick([WIN_WARM, WIN_WARM, WIN_COOL, [255, 120, 160]]), a: 0.4 + r() * 0.6, s: 0.6 + r() });
      // bridge
      const by = fh * 0.535;
      const steel = mixc(e.bld, [0, 0, 0], 0.3);
      c.fillStyle = rgba(steel); c.fillRect(-10, by, fw + 20, fh * 0.014);
      for (let i = 0; i < 7; i++) { const x = fw * (0.04 + i * 0.16); c.fillRect(x, by, fw * 0.012, fh * 0.03); }
      c.strokeStyle = rgba(steel); c.lineWidth = 1.2;
      for (let i = 0; i < 6; i++) { const x0 = fw * (0.04 + i * 0.16); c.beginPath(); c.moveTo(x0, by); c.quadraticCurveTo(x0 + fw * 0.08, by - fh * 0.03, x0 + fw * 0.16, by); c.stroke(); }
      const deck = [];
      for (let x = fw * 0.01; x < fw; x += fw * 0.035) deck.push({ x, y: by - 1, c: [255, 214, 150], a: 0.9, s: 0.8 });
      for (let x = fw * 0.03; x < fw; x += fw * 0.08) deck.push({ x, y: by + fh * 0.012, c: [90, 150, 255], a: 0.7, s: 1.2 });
      L.data.deck = deck; L.data.lights = lights.concat(deck); L.data.by = by;
      // water
      const w0 = fh * 0.555, w1 = fh * 0.87;
      const wg = c.createLinearGradient(0, w0, 0, w1);
      wg.addColorStop(0, rgba(mixc(e.haze, e.bld, 0.5))); wg.addColorStop(1, rgba(mixc(e.bld, [0, 0, 0], 0.4)));
      c.fillStyle = wg; c.fillRect(0, w0, fw, w1 - w0);
      c.strokeStyle = rgba(e.sky[e.sky.length - 1], 0.12); c.lineWidth = 1;
      for (let i = 0; i < 70; i++) { const y = w0 + Math.pow(r(), 1.6) * (w1 - w0), x = r() * fw, l = fw * (0.02 + r() * 0.12) * (y / w1); c.beginPath(); c.moveTo(x, y); c.lineTo(x + l, y); c.stroke(); }
      L.data.water = [w0, w1];
      // near bank
      const n = L.near.getContext('2d');
      const bank = mixc([60, 70, 58], [8, 10, 10], e.dark * 0.9);
      n.fillStyle = rgba(bank); n.beginPath(); n.moveTo(0, fh * 0.88); n.quadraticCurveTo(fw * 0.5, fh * 0.86, fw, fh * 0.885); n.lineTo(fw, fh); n.lineTo(0, fh); n.closePath(); n.fill();
      const step = mixc([150, 148, 140], [26, 28, 32], e.dark * 0.9);
      for (let i = 0; i < 3; i++) { n.fillStyle = rgba(shade(step, -i * 0.12)); n.fillRect(0, fh * (0.9 + i * 0.035), fw, fh * 0.02); n.fillStyle = rgba(shade(step, 0.2), 0.5); n.fillRect(0, fh * (0.9 + i * 0.035), fw, 1.5); }
      if (e.snow > 0) { n.fillStyle = 'rgba(236,240,246,0.55)'; n.fillRect(0, fh * 0.89, fw, fh); }
      n.fillStyle = rgba(mixc(bank, [0, 0, 0], 0.4)); n.fillRect(fw * 0.88, fh * 0.6, m * 0.012, fh * 0.3);
      L.data.lamp = { x: fw * 0.88 + m * 0.006, y: fh * 0.6 };
      L.data.ground = [fh * 0.9, fh];
    },
    draw(ctx, L, e, t, dt, o) {
      const { fw, fh } = L, D = L.data, m = Math.min(fw, fh);
      ctx.drawImage(L.far, o.fx, o.fy);
      const [w0, w1] = D.water;
      const night = 0.2 + e.lamps * 0.8;
      for (const l of D.lights) {
        const lx = o.fx + l.x, ly = o.fy + l.y;
        if (l.y < D.by + 4) bokeh(ctx, lx, ly, 1.2 * l.s, l.c, l.a * night);
        const len = (w1 - w0) * (0.35 + 0.5 * l.s) * (0.4 + night * 0.6);
        for (let y = w0 + 2; y < w0 + len; y += 3) {
          const k = 1 - (y - w0) / len;
          const jx = noise2(l.x * 0.05 + y * 0.08, t * 0.8 + l.x) * (3 + (y - w0) * 0.06);
          const wd = (1.2 + (y - w0) * 0.025) * l.s * (0.6 + 0.4 * noise2(y * 0.3, t * 2 + l.x));
          ctx.fillStyle = rgba(l.c, l.a * night * k * 0.42);
          ctx.fillRect(o.fx + l.x + jx - wd, o.fy + y, wd * 2, 1.4);

      // subway train crossing the bridge
      D.train = D.train ?? { x: -1, t: rand(5, 12) };
      D.train.t -= dt;
      if (D.train.t < 0 && D.train.x < 0) { D.train.x = 0.0001; D.train.t = rand(28, 50); D.train.dir = Math.random() < 0.5 ? 1 : -1; }

        D.train.x += dt * 0.07;
        const len = fw * 0.42, head = D.train.dir > 0 ? lerp(-len, fw + len, D.train.x) : lerp(fw + len, -len, D.train.x);
        const x0 = D.train.dir > 0 ? head - len : head, y = o.fy + D.by - fh * 0.012;
        ctx.fillStyle = rgba(mixc(e.bld, [0, 0, 0], 0.2), 0.95); ctx.fillRect(o.fx + x0, y, len, fh * 0.011);
        for (let x = x0; x < x0 + len; x += 5) { ctx.fillStyle = rgba([255, 244, 220], 0.85 * night); ctx.fillRect(o.fx + x, y + 1.5, 3, fh * 0.005); }
        for (let x = x0; x < x0 + len; x += 9) { ctx.fillStyle = rgba([255, 240, 210], 0.12 * night); ctx.fillRect(o.fx + x + noise2(x, t) * 3, o.fy + w0 + 6, 3, (w1 - w0) * 0.4); }
        if (D.train.x > 1) D.train.x = -1;
      }
      for (const b of D.blink) { const a = Math.pow(0.5 + 0.5 * Math.sin(t * b.sp + b.ph), 8) * e.lamps; if (a > 0.02) glow(ctx, o.fx + b.x, o.fy + b.y, m * 0.02, [255, 50, 40], a * 0.6); }
      ctx.drawImage(L.near, o.nx, o.ny);
      glow(ctx, o.nx + D.lamp.x, o.ny + D.lamp.y, m * 0.22, [255, 226, 180], 0.4 * e.lamps);
      bokeh(ctx, o.nx + D.lamp.x, o.ny + D.lamp.y, m * 0.03, [255, 236, 200], 0.9 * e.lamps);
      o.weather(null);
    },
    amb(e) { return e.amb; },
  };

  const list = [roof, booth, street, store, stairs, river];
  const byId = Object.fromEntries(list.map((s) => [s.id, s]));

  // ── renderer: layers, parallax, weather, haze, lightning, grading
  function Renderer(canvas) {
    const ctx = canvas.getContext('2d');
    const R = { canvas, ctx, L: null, scene: null, env: null, key: '', rain: [], snow: [], splash: [], flash: 0, flashT: rand(8, 18), haze: 0, w: 1, h: 1, scale: 1, leaves: [] };
    R.resize = function (W, H, dpr) {
      R.scale = clamp(Math.min(dpr, 2) * 0.55, 0.62, 1.1);
      R.w = Math.max(2, Math.round(W * R.scale)); R.h = Math.max(2, Math.round(H * R.scale));
      canvas.width = R.w; canvas.height = R.h;
      R.key = '';
    };
    R.set = function (scene, e) {
      const key = scene.id + '|' + e.time + '|' + e.weather + '|' + R.w + 'x' + R.h;
      if (key === R.key) return;
      R.key = key; R.scene = scene; R.env = e;
      const mgn = Math.round(Math.max(R.w, R.h) * 0.04);
      const fw = R.w + mgn * 2, fh = R.h + mgn * 2;
      const keep = R.L && R.L.id === scene.id ? R.L.data : {};
      const L = { id: scene.id, w: R.w, h: R.h, m: mgn, fw, fh, far: makeCanvas(fw, fh), near: makeCanvas(fw, fh), data: { walk: keep.walk || 0 } };
      scene.build(L, e);
      R.L = L;
      R.rain.length = 0; R.snow.length = 0;
    };
    function weather(clips, ox, oy, dt, t) {
      const e = R.env, w = R.w, h = R.h;
      if (!e.rain && !e.snow && e.wind < 0.6) return;
      ctx.save();
      if (clips) { ctx.beginPath(); for (const g of clips) ctx.rect(ox + g[0], oy + g[1], g[2], g[3]); ctx.clip(); }
      const wind = (e.wind * 0.9 + 0.1) * (R.scene.indoor ? 0.6 : 1);
      if (e.rain) {
        const n = Math.round(240 * e.rain * (w * h) / (500 * 900) + 60);
        while (R.rain.length < n) R.rain.push({ x: rand(-0.2, 1.2) * w, y: rand(-1, 1) * h, z: Math.random() });
        ctx.lineCap = 'round';
        for (const p of R.rain) {
          const v = (0.9 + p.z * 1.6) * h, wx = wind * 0.32 * v;
          p.y += v * dt; p.x += wx * dt;
          if (p.y > h + 20) { p.y = rand(-0.25, 0) * h; p.x = rand(-0.2, 1.2) * w; }
          const len = (0.025 + p.z * 0.06) * h;
          ctx.strokeStyle = `rgba(205,215,232,${0.07 + p.z * 0.16})`;
          ctx.lineWidth = 0.6 + p.z * 1.3;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - (wx / v) * len, p.y - len); ctx.stroke();
        }
        const G = R.L.data.ground;
        if (G && !clips) {
          if (R.splash.length < 40 && Math.random() < 0.9) R.splash.push({ x: rand(w), y: oy + rand(G[0], G[1]), t: 0 });
          for (let i = R.splash.length - 1; i >= 0; i--) {
            const s = R.splash[i]; s.t += dt * 4;
            if (s.t > 1) { R.splash.splice(i, 1); continue; }
            ctx.strokeStyle = `rgba(220,228,240,${0.35 * (1 - s.t)})`; ctx.lineWidth = 0.8;
            ctx.beginPath(); ctx.ellipse(s.x, s.y, 1 + s.t * 5, 0.4 + s.t * 1.4, 0, 0, TAU); ctx.stroke();
          }
        }
      }
      if (e.snow) {
        const n = Math.round(150 * e.snow * (w * h) / (500 * 900) + 40);
        while (R.snow.length < n) R.snow.push({ x: rand(w), y: rand(h), z: Math.pow(Math.random(), 1.3), ph: rand(TAU) });
        for (const p of R.snow) {
          const v = (0.03 + p.z * 0.09) * h;
          p.y += v * dt; p.x += (wind * 0.05 * h + Math.sin(t * 0.9 + p.ph) * 0.02 * h) * dt * (0.4 + p.z);
          if (p.y > h + 10) { p.y = -10; p.x = rand(w); }
          if (p.x > w + 10) p.x = -10; if (p.x < -10) p.x = w + 10;
          const s = (0.6 + p.z * p.z * 4.2) * (h / 700);
          if (p.z > 0.82) bokeh(ctx, p.x, p.y, s * 1.6, [240, 244, 252], 0.28);
          else { ctx.fillStyle = `rgba(240,244,252,${0.35 + p.z * 0.5})`; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill(); }
        }
      }
      if (e.wind > 0.6 && !clips) {
        if (R.leaves.length < 4 && Math.random() < dt * 0.4) R.leaves.push({ x: -20, y: rand(0.2, 0.9) * h, vx: rand(0.25, 0.5) * w, vy: rand(-0.05, 0.05) * h, a: rand(TAU), va: rand(4, 9), s: rand(2, 4.5) * (h / 700) });
        for (let i = R.leaves.length - 1; i >= 0; i--) {
          const l = R.leaves[i]; l.x += l.vx * dt; l.y += (l.vy + Math.sin(t * 3 + l.a) * 0.06 * h) * dt; l.a += l.va * dt;
          if (l.x > w + 30) { R.leaves.splice(i, 1); continue; }
          ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a); ctx.scale(1, Math.abs(Math.sin(l.a * 0.7)) + 0.2);
          ctx.fillStyle = rgba(mixc([120, 80, 40], [20, 16, 12], e.dark * 0.8), 0.85); ctx.beginPath(); ctx.ellipse(0, 0, l.s * 2, l.s, 0, 0, TAU); ctx.fill(); ctx.restore();
        }
      }
      ctx.restore();
    }
    R.draw = function (t, dt, cam, fx) {
      const L = R.L, e = R.env;
      if (!L) return;
      const k = R.scale;
      const o = {
        fx: -L.m + cam.x * k * 0.35, fy: -L.m + cam.y * k * 0.35,
        nx: -L.m + cam.x * k, ny: -L.m + cam.y * k,
        idle: fx.idle, walkSpeed: fx.walkSpeed, onSwitch: fx.onSwitch,
        weather: (clips, ox = 0, oy = 0) => weather(clips, ox, oy, dt, t),
      };
      R.scene.draw(ctx, L, e, t, dt, o);
      // fog
      if (e.fog > 0.1) {
        const g = ctx.createLinearGradient(0, 0, 0, R.h);
        g.addColorStop(0, rgba(e.haze, e.fog * 0.3)); g.addColorStop(0.55, rgba(e.haze, e.fog * 0.55)); g.addColorStop(1, rgba(e.haze, e.fog * 0.3));
        ctx.fillStyle = g; ctx.fillRect(0, 0, R.w, R.h);
      }
      // smoke haze filling the air
      R.haze = fx.haze;
      if (R.haze > 0.01) {
        const g = ctx.createLinearGradient(0, 0, 0, R.h);
        const hc = R.scene.indoor ? [196, 200, 196] : [190, 194, 204];
        g.addColorStop(0, rgba(hc, R.haze * (R.scene.indoor ? 0.34 : 0.18))); g.addColorStop(1, rgba(hc, R.haze * 0.1));
        ctx.fillStyle = g; ctx.fillRect(0, 0, R.w, R.h);
      }
      // eye adaptation to a flame at night / warm ember spill
      if (fx.flame > 0.01) { ctx.fillStyle = `rgba(0,0,0,${fx.flame * 0.16 * (0.3 + e.dark)})`; ctx.fillRect(0, 0, R.w, R.h); }
      // lightning
      if (e.thunder) {
        R.flashT -= dt;
        if (R.flashT < 0) { R.flashT = rand(9, 26); R.flashSeq = [0, 0.09, 0.2, 0.32].map((v) => v + rand(0, 0.03)); R.flashAge = 0; if (fx.onThunder) fx.onThunder(); }
        if (R.flashSeq) {
          R.flashAge += dt;
          let a = 0; for (const s of R.flashSeq) { const d = R.flashAge - s; if (d > 0 && d < 0.09) a = Math.max(a, 1 - d / 0.09); }
          if (R.flashAge > 0.6) R.flashSeq = null;
          R.flash = a;
          if (a > 0) { ctx.fillStyle = `rgba(210,220,255,${a * (R.scene.indoor ? 0.18 : 0.42)})`; ctx.fillRect(0, 0, R.w, R.h); }
        } else R.flash = 0;
      } else R.flash = 0;
    };
    R.ambient = function () { return R.scene && R.L ? R.scene.amb(R.env, R.L) : [1, 1, 1]; };
    R.sinkScreen = function (cam) {
      if (!R.scene || !R.scene.sink) return null;
      const s = R.scene.sink(R.L);
      return { x: (s.x - R.L.m + cam.x * R.scale) / R.scale, y: (s.y - R.L.m + cam.y * R.scale) / R.scale, r: s.r / R.scale };
    };
    return R;
  }
  // scene thumbnail (static frame)
  function thumb(scene, e, cv) {
    const w = cv.width, h = cv.height, mgn = 2;
    const L = { id: scene.id, w, h, m: mgn, fw: w + mgn * 2, fh: h + mgn * 2, far: makeCanvas(w + mgn * 2, h + mgn * 2), near: makeCanvas(w + mgn * 2, h + mgn * 2), data: { walk: 30, target: 1, lightOn: 1 } };
    scene.build(L, e);
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    const o = { fx: -mgn, fy: -mgn, nx: -mgn, ny: -mgn, idle: 0, walkSpeed: 0, weather: () => {} };
    try { scene.draw(ctx, L, e, 1, 0.016, o); } catch (err) { console.warn(err); }
    if (e.fog > 0.1) { ctx.fillStyle = rgba(e.haze, e.fog * 0.4); ctx.fillRect(0, 0, w, h); }
  }
  return { TIMES, WEATHERS, env, autoTime, list, byId, Renderer, thumb };
})();

const Props = (() => {

  // ── cigarette sprite (static, high-res)

    x.fillRect(T.filter - 0.5, -R, T.len - T.filter + 1, T.dia);
    if (T.cigar) {

    if (T.tip === 'cork') {
      for (let i = 0; i < T.filter * T.dia * 9; i++) { const dk = r() < 0.6; x.fillStyle = dk ? `rgba(130,74,30,${0.18 + r() * 0.3})` : `rgba(240,196,140,${0.15 + r() * 0.25})`; x.beginPath(); x.ellipse(r() * T.filter, (r() * 2 - 1) * R, 0.1 + r() * 0.35, 0.06 + r() * 0.16, r() * 3, 0, TAU); x.fill(); }

      x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = 0.22; x.beginPath(); x.ellipse(T.filter * 0.48, -R * 0.12, 1.75, 1.55, 0, 0, TAU); x.stroke();
    }

        x.fillStyle = cylGrad(x, 0, -R, 0, R, [190, 30, 30], { hi: 0.4, lo: 0.4 }); x.fillRect(T.filter + 2, -R, 7, T.dia);

  // ── ash (procedural, deterministic per seed)
  function drawAsh(ctx, T, len, R, heat, seed, rings, burnPos) {
    if (len < 0.15) return;
    const ac = T.ash;
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.99);
    for (let s = 0; s <= len; s += 0.55) ctx.lineTo(s, -R * (0.94 + 0.06 * noise2(s * 0.8 + seed, 1.3)) - Math.max(0, s - len + 1.2) * 0.25);

    for (let s = len; s >= 0; s -= 0.55) ctx.lineTo(s, R * (0.94 + 0.06 * noise2(s * 0.8 + seed, 4.1)) + Math.max(0, s - len + 1.2) * 0.15);

    ctx.fillStyle = g2; ctx.fill();
    ctx.save(); ctx.clip();
    const r = mulberry(seed * 1000 | 0);
    if (rings) for (const rp of rings) { const s = rp - burnPos; if (s > 0.3 && s < len) { ctx.fillStyle = 'rgba(26,24,22,0.45)'; ctx.fillRect(s - 0.15, -R, 0.3, R * 2); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(s + 0.15, -R, 0.22, R * 2); } }
    for (let s = 0.6; s < len; s += 0.7 + r() * 0.9) { ctx.fillStyle = `rgba(30,28,26,${0.08 + r() * 0.12})`; ctx.fillRect(s, -R, 0.12, R * 2); }

  // ── cigarette (dynamic)

  function drawCig(ctx, T, st) {
    const R = T.dia / 2, k = Math.max(4, st.S * st.dpr * 1.25 * Math.max(1, st.sc));

      wl.addColorStop(0, `rgba(255,120,40,${0.08 + heat * 0.3})`); wl.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = wl; ctx.fillRect(bx - 9, -R, 9, T.dia);
      ctx.globalCompositeOperation = 'source-over';

      sg.addColorStop(0, 'rgba(190,140,70,0)'); sg.addColorStop(0.35, 'rgba(185,135,70,0.18)'); sg.addColorStop(0.62, 'rgba(120,74,36,0.5)'); sg.addColorStop(0.82, 'rgba(52,30,16,0.88)'); sg.addColorStop(0.94, 'rgba(22,14,10,1)'); sg.addColorStop(1, 'rgba(12,8,6,1)');
      ctx.fillStyle = sg; ctx.fillRect(bx - 4.2, -R - 1, 4.6, T.dia + 2);
    }

      ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(T.filter * 0.48, -R * 0.12, 1.6, 1.4, 0, 0, TAU); ctx.fill();
    }

      const heat = st.heat;
      // ash

      drawAsh(ctx, T, st.ash, R, heat, st.ashSeed, st.rings, st.burn);
      ctx.restore();
      // glowing coal: an area of heat at the paper edge that shines through the base of the ash
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const fl = 0.86 + 0.14 * noise1(st.t * 6.5 + st.seed);
      const h = clamp(heat * fl, 0, 1);
      const cl = 0.9 + h * 1.4 + Math.min(st.ash, 1.2) * 0.3;
      ctx.beginPath();
      ctx.moveTo(bx + jag(-R) - 0.25, -R * 0.98);
      for (let i = 0; i <= 8; i++) { const yy = -R + (2 * R * i) / 8; ctx.lineTo(bx + jag(yy) - 0.25, yy * 0.98); }
      ctx.lineTo(bx + cl, R * 0.9); ctx.quadraticCurveTo(bx + cl + R * 0.25, 0, bx + cl, -R * 0.9); ctx.closePath();
      const cg = ctx.createLinearGradient(bx - 0.3, 0, bx + cl, 0);
      cg.addColorStop(0, `rgba(255,${(70 + 120 * h) | 0},${(14 + 60 * h) | 0},${0.55 + 0.45 * h})`);
      cg.addColorStop(0.35, `rgba(255,${(50 + 80 * h) | 0},12,${0.22 + 0.5 * h})`);
      cg.addColorStop(1, 'rgba(200,40,10,0)');

    if (G.phase === 'unlit') { LT.vis = 0; LT.target = 1; Sound.sfx.slide(); }
  }
  function pickPlace(id) {
    if (S.place === id) { closeSheet(); return; }
    S.place = id; saveS(); closeSheet();
    $('#curtain').classList.add('on');
    setTimeout(() => { refreshScene(); G.haze = 0; Smoke.clear(); G.idle = 0; $('#curtain').classList.remove('on'); }, 380);
  }
  function setMode(m) {
    if (S.mode === m) return;
    if (C) { finishCig(C, false); C = null; }
    O = null; butts.length = 0;
    S.mode = m; saveS();
    LT.target = 0; LT.vis = 0; LT.on = false; LT.flame = 0;
    Sound.setCrackle(0); Sound.setCoil(0); Sound.setFlame('bic', 0);
    enterMode();
  }
  function updateDock() {
    $('#dock').dataset.mode = S.mode;
    $('#bChain').classList.toggle('on', !!S.chain);
    $('#bChain').setAttribute('aria-pressed', String(!!S.chain));
    $('#bSound').classList.toggle('off', !S.sound);
  }
  function updateAction() {
    const a = $('#bAction');
    const show = (G.phase === 'lit' && S.mode === 'cig') || G.phase === 'heated' || G.phase === 'preheat';
    a.classList.toggle('show', show);
    a.dataset.kind = S.mode === 'cig' ? 'stub' : 'eject';
  }
  document.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); Sound.sfx.ui(); setMode(b.dataset.mode); updateDock(); }));
  document.querySelectorAll('#dock [data-sheet]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); Sound.sfx.ui(); openSheet(b.dataset.sheet); }));
  $('#bChain').addEventListener('click', (e) => { e.stopPropagation(); S.chain = !S.chain; saveS(); updateDock(); Sound.sfx.pick(); buzz(8); });
  $('#bAction').addEventListener('click', (e) => { e.stopPropagation(); stubOut(); });
  $('#bSound').addEventListener('click', (e) => { e.stopPropagation(); S.sound = !S.sound; saveS(); Sound.setEnabled(S.sound); updateDock(); });
  const bFull = $('#bFull');
  const fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen) || !document.fullscreenEnabled) bFull.hidden = true;
  bFull.addEventListener('click', (e) => {
    e.stopPropagation();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl).catch?.(() => {});
    } catch (err) {}
  });
  ['pointerdown', 'pointerup', 'touchstart'].forEach((ev) => { $('#ui').addEventListener(ev, (e) => { if (e.target.closest('button,#sheet')) e.stopPropagation(); }, { passive: true }); });

  // stage pointer handling
  let activePointer = null;
  stage.addEventListener('pointerdown', (e) => {
    if (!G.started) return;
    if (activePointer !== null) return;
    activePointer = e.pointerId;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    I.kb = false;
    pressStart(e.clientX, e.clientY);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', (e) => { if (e.pointerId === activePointer) pressMove(e.clientX, e.clientY); });
  const endP = (e) => { if (e.pointerId !== activePointer) return; activePointer = null; pressEnd(e.clientX, e.clientY); };
  stage.addEventListener('pointerup', endP);
  stage.addEventListener('pointercancel', endP);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  // keyboard
  window.addEventListener('keydown', (e) => {
    if (!G.started) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); start(); } return; }
    if (e.repeat) { if (e.code === 'Space') e.preventDefault(); return; }
    if (e.code === 'Space') { e.preventDefault(); I.kb = true; pressStart(W * 0.5, H * 0.38); }
    else if (e.code === 'KeyF') flick();
    else if (e.code === 'KeyC') popCapsule();
    else if (e.code === 'KeyX') stubOut();
    else if (e.code === 'KeyM') { setMode(S.mode === 'cig' ? 'vape' : 'cig'); updateDock(); }
    else if (e.code === 'Escape') closeSheet();
    else if (/^Digit[1-6]$/.test(e.code)) pickPlace(Scenes.list[+e.code.slice(5) - 1].id);
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space' && G.started) { e.preventDefault(); pressEnd(W * 0.5, H * 0.38); } });

  // ── intro
  function start() {
    if (G.started) return;
    G.started = true;
    Sound.unlock(); Sound.setEnabled(S.sound);
    refreshScene();
    requestWake();
    dissolveTitle();
    document.body.classList.add('live');
    setTimeout(() => { enterMode(); }, 650);
  }
  function dissolveTitle() {
    const h1 = $('#intro h1');
    const r = h1.getBoundingClientRect();
    const cs = getComputedStyle(h1);
    const cv = makeCanvas(r.width, r.height), x = cv.getContext('2d');
    x.fillStyle = '#fff'; x.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; x.textBaseline = 'middle'; x.textAlign = 'center';
    if (x.letterSpacing !== undefined) x.letterSpacing = cs.letterSpacing;
    x.fillText(h1.textContent.trim(), r.width / 2 + parseFloat(cs.letterSpacing || 0) / 2, r.height / 2);
    const data = x.getImageData(0, 0, cv.width, cv.height).data;
    const pts = [];
    for (let i = 0; i < 2400 && pts.length < 230; i++) {
      const px = Math.floor(Math.random() * cv.width), py = Math.floor(Math.random() * cv.height);
      if (data[(py * cv.width + px) * 4 + 3] > 120) pts.push([r.left + px, r.top + py]);
    }
    const sz = LY.sz;
    for (const [px, py] of pts) Smoke.splat(px, py, rand(-30, 30) * sz, rand(-70, -10) * sz, [0.9, 0.88, 0.85], 0.32, 2.6 * sz, 9 * sz);
    Sound.sfx.whoosh();
    $('#intro').classList.add('gone');
  }
  $('#start').addEventListener('click', (e) => { e.stopPropagation(); start(); });
  $('#intro').addEventListener('click', () => start());

  // wake lock
  let wake = null;
  async function requestWake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => (wake = null)); } } catch (e) {} }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Sound.suspend(); if (I.down) pressEnd(I.x, I.y); }
    else { Sound.resume(); if (G.started) requestWake(); last = performance.now(); }
  });

  // ── loop
  let last = performance.now(), errOnce = false, perf = { acc: 0, n: 0, lowT: 0 };
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) return;
    dt = FIXED ? 1 / 60 : Math.min(dt, 0.05);
    try { update(dt); render(dt); }
    catch (err) { if (!errOnce) { errOnce = true; console.error(err); } }
    // adaptive quality
    perf.acc += dt; perf.n++;
    if (perf.n >= 90) {
      const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0;
      if (avg > 0.026 && G.started && !FIXED && !QS.get('q')) { perf.lowT++; if (perf.lowT >= 2) { perf.lowT = 0; if (Smoke.quality === 'high') Smoke.setQuality('mid'); else if (Smoke.quality === 'mid') Smoke.setQuality('low'); } }
      else perf.lowT = 0;
    }
  }
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  // grain texture
  (function grain() {
    const c = makeCanvas(140, 140), x = c.getContext('2d'), d = x.createImageData(140, 140);
    for (let i = 0; i < d.data.length; i += 4) { const v = (Math.random() * 255) | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0);
    try { $('#grain').style.backgroundImage = `url(${c.toDataURL('image/png')})`; } catch (e) {}
  })();
  resize();
  updateHUD(); updateDock(); updateAction();
  window.__damta = { G, S, I, LT, Scenes, Props, get LY() { return LY; }, tip: () => C && tipPoint(C), get C() { return C; }, Smoke, scene, start, pressStart, pressEnd, pressMove, setMode, pickPlace, stubOut, flick, info: () => Smoke.info() };
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();

})();
</script>
</body>
